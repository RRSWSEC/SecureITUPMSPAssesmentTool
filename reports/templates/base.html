<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ report_title }} - {{ client.name }}</title>
  <style>
    :root {
      color: #111827;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }
    body { margin: 0; background: #f7f8fa; }
    main { max-width: 1120px; margin: 0 auto; padding: 40px 28px; background: #fff; min-height: 100vh; }
    header { border-bottom: 3px solid #0f766e; padding-bottom: 22px; margin-bottom: 28px; }
    h1 { margin: 0 0 8px; font-size: 34px; letter-spacing: 0; }
    h2 { margin-top: 32px; font-size: 22px; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; }
    h3 { margin: 22px 0 8px; font-size: 17px; }
    .meta { color: #4b5563; font-size: 14px; }
    .summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 20px 0; }
    .metric { border: 1px solid #d8dee4; border-radius: 8px; padding: 14px; background: #fafafa; }
    .metric span { display: block; color: #4b5563; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
    .metric strong { display: block; margin-top: 6px; font-size: 24px; }
    table { width: 100%; border-collapse: collapse; margin: 14px 0 24px; font-size: 13px; }
    th, td { border: 1px solid #e5e7eb; padding: 9px 10px; text-align: left; vertical-align: top; }
    th { background: #f3f4f6; font-size: 12px; text-transform: uppercase; color: #374151; letter-spacing: .04em; }
    .badge { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
    .Critical { background: #fee2e2; color: #991b1b; }
    .High { background: #ffedd5; color: #9a3412; }
    .Medium { background: #fef9c3; color: #854d0e; }
    .Low { background: #dcfce7; color: #166534; }
    .Informational { background: #e0f2fe; color: #075985; }
    .note { border-left: 4px solid #0f766e; padding: 10px 14px; background: #f0fdfa; color: #134e4a; }
    .section-band { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; }
    @media print {
      body { background: #fff; }
      main { padding: 0; }
      a { color: inherit; }
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>{{ report_title }}</h1>
    <div class="meta">{{ client.name }} | {{ assessment.name }} | Generated from authorized assessment data</div>
  </header>
  {% block content %}{% endblock %}
</main>
</body>
</html>
