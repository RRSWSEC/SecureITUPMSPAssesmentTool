services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secureitup
      POSTGRES_USER: secureitup
      POSTGRES_PASSWORD: secureitup
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureitup -d secureitup"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://secureitup:secureitup@db:5432/secureitup
      SECRET_KEY: dev-compose-change-me-please-override-32-bytes
      DEV_SEED_USERNAME: admin@example.com
      DEV_SEED_PASSWORD: ChangeMeDevOnly!123
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres-data:
